# Manifest — repos to clone and symlinks to create on a fresh machine
#
# WHAT IS ACTUALLY READ: install.sh consumes only `home_symlinks` and
# `config_symlinks` (see link_block). The `repos:` and `jd_symlinks:` blocks
# below are documentation — nothing clones them and nothing creates those JD
# links. Treat them as an inventory, not as executable setup.
#
# LAYOUT: repos are no longer flat under ~/repos/. Since 2026-08-18 they are
# grouped one level down by kind:
#   ~/repos/system/   own system + agent/obsidian tooling (this repo)
#   ~/repos/etc/      own everything else (blog, nelson.love, macos-tools, …)
#   ~/repos/forks?/   third-party obsidian forks and clones
#   ~/repos/<owner>/  other people's clones, by GitHub owner
# The trailing "?" in forks? is upstream's actual directory name, not a typo
# here. The group is deliberately NOT recorded per-repo below: several entries
# no longer exist on disk, and the grouping was still settling when this was
# written. Resolve a repo by searching, not by assuming a path.

repos:
  jd-cli:
    url: git@github.com:nelsonlove/johnnydecimal.py.git
    jd_link: "00-09 System/07 Apps & config/07.40 JD tools/+REPO jd-cli"

  # Inventory of ~/repos as of 2026-07-11 (jd_link pending for most).
  agent-approvals:
    url: git@github.com:nelsonlove/agent-approvals.git
  claude-code-plugins:
    url: git@github.com:nelsonlove/claude-code-plugins.git
  jd-numbering:
    url: git@github.com:nelsonlove/jd-numbering.git
  nelson.love:
    url: git@github.com:nelsonlove/nelson.love.git
  obsidian-execute-code:
    url: git@github.com:nelsonlove/obsidian-execute-code.git
  obsidian-vault-mcp-plugin:
    url: git@github.com:nelsonlove/obsidian-vault-mcp-plugin.git
  ops:  # upstream (callumalpass), not a fork
    url: git@github.com:callumalpass/ops.git
  repoint-links:
    url: git@github.com:nelsonlove/repoint-links.git
  tasknotes-workflows:
    url: git@github.com:nelsonlove/tasknotes-workflows.git
  vault-skills:
    url: git@github.com:nelsonlove/vault-skills.git
  # pickle-ios — local-only, NO remote; push it somewhere before relying on this list
  # obsidian-perf — scratch/perf-work dir moved in from ~/Desktop; not a clone target

  # Add more repos here as they get JD IDs:
  # my-project:
  #   url: git@github.com:nelsonlove/my-project.git
  #   jd_link: "60-69 Work/61 Projects/61.03 My Project/my-project"

home_symlinks:
  # Dotfiles that must live directly in $HOME. Source (in this repo) → target.
  # ~/.zshenv is read before ZDOTDIR is set, so it can't live under ~/.config/zsh.
  zsh/.zshenv: ~/.zshenv
  # Claude Code user config (secrets stay in ~/.claude/settings.local.json)
  # settings.json + hooks are the single source of truth for BOTH hosts (mbp/mba);
  # host-specific overrides go in ~/.claude/settings.local.json which merges on top.
  claude/settings.json: ~/.claude/settings.json
  claude/hooks: ~/.claude/hooks
  claude/skills: ~/.claude/skills
  # settings.local.json is a committed symlink into 09.11 Secrets (iCloud) — secret content never enters this repo
  claude/settings.local.json: ~/.claude/settings.local.json
  # CLAUDE.md is a committed symlink into the vault (05.11 folder's global-conventions note,
  # moved from 03.11 in the 03→05 "AI agents" renumber), the top of the instruction cascade —
  # same source-of-truth-in-vault pattern as memory (03.17)
  claude/CLAUDE.md: ~/.claude/CLAUDE.md

config_symlinks:
  # Source (in this repo) → target (on the system)
  aerospace: ~/.config/aerospace
  alacritty: ~/.config/alacritty
  doom: ~/.config/doom        # Doom Emacs config
  gh: ~/.config/gh
  git: ~/.config/git
  jd: ~/.config/jd
  karabiner: ~/.config/karabiner
  micro: ~/.config/micro
  # config.json inside is a committed symlink into 09.11 Secrets (iCloud) — holds the pickle API token
  pickle: ~/.config/pickle
  proselint: ~/.config/proselint
  tmux: ~/.config/tmux
  zsh: ~/.config/zsh

jd_symlinks:
  # Source (on the system) → target (in JD tree, relative to ~/Documents/)
  ~/repos/system/dotfiles: "00-09 System/07 Apps & config/07.11 Dotfiles/+REPO dotfiles"
