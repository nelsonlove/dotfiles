version: 1
id: vault-backup
name: Vault Backup (auto-commit, every 30m)
status: disabled

# RETIRED 2026-09-29 (Nelson: "All A" on the MacBook Pro move): obsidian-backup is the one vault backup job (#91 re-gates it to the Pro). The script stays in scripts/vault-backup/. The old repo ~/vault-backup.git on the Pro is left in place; what happens to it is Nelson's call.
# Before it retired, this job auto-committed ~/obsidian into ~/vault-backup.git on the MacBook Pro, gated on hostname so it ran nowhere else.
triggers:
  - type: script
    schedule: "*/30 * * * *"
    command: ["@config/scripts/_lib/on-host.sh", "Nelsons-MacBook-Pro"]
    timeout: 10s

run:
  command: ["@config/scripts/vault-backup/run.sh"]
  timeout: 5m
