version: 1
id: vault-mcp-remote-update
name: Vault-MCP remote proxy — notify if behind origin/main
status: active

# MBP-only: the remote MCP proxy (the com.nelson.vault-mcp-remote LaunchAgent) runs only on the MacBook Pro, behind the cloudflared tunnel. Its public hostname is private config (~/.config/vault-mcp-remote/public-hostname; see scripts/vault-mcp-remote-update/public-hostname.example), not in this public repo. The checkout it runs drifts behind origin/main, and the drift goes UNNOTICED (found 6 commits behind). This job DETECTS and shows a plain notice once a day; it never auto-applies. launchd's KeepAlive keeps the proxy running; the pull, rebuild and restart stay a manual step, so unvetted main commits never auto-deploy to the live endpoint. Host-gated to the MBP.
triggers:
  - type: script
    schedule: "0 9 * * *"
    command: ["@config/scripts/_lib/gated.sh", "Nelsons-MacBook-Pro", "vault-mcp-remote-update"]
    timeout: 10s

run:
  command: ["@config/scripts/vault-mcp-remote-update/run.sh"]
  timeout: 2m
