version: 1
id: obsidian-backup
name: obsidian Backup (auto-commit, every 30m)
status: active

# Air-only: ~/obsidian (the Assent-era vault) lives on the MacBook Air; its
# local-only safety-net repo is ~/obsidian-backup.git. The script trigger
# gates on hostname so it never runs on other machines. Successor to the
# retired obsidian-new-backup job (disabled 2026-08-08, target absorbed).
triggers:
  - type: script
    schedule: "*/30 * * * *"
    command: ["@config/scripts/_lib/on-host.sh", "Nelsons-MacBook-Air"]
    timeout: 10s

run:
  command: ["@config/scripts/obsidian-backup/run.sh"]
  timeout: 5m
