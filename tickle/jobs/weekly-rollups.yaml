version: 1
id: weekly-rollups
name: Weekly rollups (Monday, for the ISO week just ended)
status: disabled

# Ruled by Nelson 2026-09-29: "alright go for it" (cross-session log 02:56). Owned by [L0-MA] tickle (log 03:21). SHIPS DISABLED: it starts a `claude --bg` lieutenant, and nothing that runs claude is scheduled until Nelson says credits are back ("we'll have to have agents handle those jobs until i can add credits"). Until then the obsidian captain dispatches `[L0-OB] weekly rollups YYYY-Www` by hand on Mondays. Before `status: active`: one watched run by hand for the week just ended, on Nelson's word.
#
# Every guard (pause, load, no overwrite, live lieutenant, previous week, brief markers, placeholder, the Claude daemon's API key) is in run.sh, in that order, under a lock, so `tickle run weekly-rollups` by hand is guarded too. `run.sh --dry-run` goes through them all and dispatches nothing. The trigger adds only the host (on-host.sh, not gated.sh: run.sh checks the pause itself): the job must run on ONE machine, or two daemons start two lieutenants. The host is the Air today; the MacBook Pro cut-over re-gates it with the other jobs.
triggers:
  - type: script
    schedule: "30 7 * * 1"
    command: ["@config/scripts/_lib/on-host.sh", "Nelsons-MacBook-Air"]
    timeout: 10s

run:
  command: ["@config/scripts/weekly-rollups/run.sh"]
  timeout: 15m   # above the worst case: 60 s per claude call, 12 calls, 27 s of confirm naps
