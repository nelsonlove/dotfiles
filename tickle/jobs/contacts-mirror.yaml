version: 1
id: contacts-mirror
name: Contacts mirror (27.20) from Apple Contacts, daily
status: disabled

# Ruled by Nelson 2026-09-30: "a plus job" (areas admiral, cross-session log 05:50). Owned by [L0-MA] tickle. SHIPS DISABLED: Nelson has not yet picked how the job reads Contacts (tickle has no Contacts grant; `reader` in config.json is a placeholder), and the people ship has not yet ruled who gets a new note. See tickle/scripts/contacts-mirror/README.md.
#
# The trigger runs gated.sh (host and fleet pause), so tickle records a pause as a skipped check. run.sh checks the pause again for a run by hand, then the load gate and a fresh backup. The host is the Air today; the MacBook Pro cut-over re-gates it with the other jobs.
triggers:
  - type: script
    schedule: "20 4 * * *"
    command: ["@config/scripts/_lib/gated.sh", "Nelsons-MacBook-Air", "contacts-mirror"]
    timeout: 10s

run:
  command: ["@config/scripts/contacts-mirror/run.sh"]
  timeout: 15m
